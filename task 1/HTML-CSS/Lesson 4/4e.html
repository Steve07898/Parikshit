<style>
  .apply-button {
    background-color: rgb(10, 102, 194);
    color: white;
    border: none;
    padding-top: 10px;
    padding-bottom: 10px;
    padding-left: 24px;
    padding-right: 24px;
    font-weight: bold;
    border-radius: 18px;
    cursor: pointer;
    transition: background-color 0.15s;
  }

  .apply-button:hover {
    background-color: rgb(0, 65, 130);
  }

  .save-button {
    background-color: white;
    color: rgb(10, 102, 194);
    border: 1px solid rgb(10, 102, 194);
    padding-top: 9px;
    padding-bottom: 9px;
    padding-left: 16px;
    padding-right: 16px;
    font-weight: bold;
    border-radius: 18px;
    cursor: pointer;
    margin-left: 8px;
    transition: background-color 0.15s, border-width 0.15s;
  }

  .save-button:hover {
    background-color: rgb(230, 243, 255);
    border-width: 2px;
  }
</style>

<button class="apply-button">
  Apply on company website
</button>

<button class="save-button">
  Save
</button>
