<style>
  .get-started-button {
    background-color: rgb(121, 82, 179);
    color: white;
    border: none;
    padding-top: 10px;
    padding-bottom: 10px;
    padding-left: 16px;
    padding-right: 16px;
    border-radius: 4px;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 0.15s;
  }

  .get-started-button:hover {
    background-color: rgb(104, 63, 165);
  }

  .download-button {
    background-color: white;
    color: rgb(108, 117, 125);
    border: 1px solid rgb(108, 117, 125);
    padding-top: 9px;
    padding-bottom: 9px;
    padding-left: 16px;
    padding-right: 16px;
    border-radius: 4px;
    font-weight: bold;
    cursor: pointer;
    margin-left: 8px;
    transition: background-color 0.15s, color 0.15s;
  }

  .download-button:hover {
    background-color: rgb(108, 117, 125);
    color: white;
  }
</style>

<button class="get-started-button">
  Get started
</button>

<button class="download-button">
  Download
</button>
