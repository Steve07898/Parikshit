<style>
  .amazon-link {
    color: rgb(0, 113, 133);
    text-decoration: none;
  }

  .amazon-link:hover {
    color: rgb(204, 102, 0);
    text-decoration: underline;
  }

  .shoe-title {
    font-weight: bold;
    font-size: 24px;
  }

  .stock-status {
    color: rgb(0, 118, 0);
    font-weight: bold;
  }

  .add-to-cart-button {
    background-color: rgb(255, 216, 20);
    border: none;
    height: 36px;
    width: 120px;
    border-radius: 18px;
    cursor: pointer;
    transition: background-color 0.15s;
  }

  .add-to-cart-button:hover {
    background-color: rgb(240, 202, 0);
  }

  .buy-now-button {
    background-color: rgb(255, 164, 28);
    border: none;
    height: 36px;
    width: 120px;
    border-radius: 18px;
    cursor: pointer;
    margin-left: 8px;
    transition: background-color 0.15s;
  }

  .buy-now-button:hover {
    background-color: rgb(fa, 142, 22);
  }
</style>

<a href="https://www.amazon.com" class="amazon-link">
  Back to Amazon
</a>

<p class="shoe-title">
  Nike Black Running Shoes
</p>

<p class="stock-status">
  $39 - in stock.
</p>

<p>
  Free delivery tomorrow.
</p>

<button class="add-to-cart-button">
  Add to Cart
</button>

<button class="buy-now-button">
  Buy now
</button>
